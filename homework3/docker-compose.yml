    image: mongo:7
    container_name: shard4c
    command: bash -c "chmod 400 /data/keyfile && exec mongod --shardsvr --replSet shard4RS --port 27018 --bind_ip_all --keyFile /data/keyfile"
    volumes:
      - shard4c_data:/data/db
      - ./keyfile:/data/keyfile
    networks:
      - mongo-cluster

  mongos1:
    image: mongo:7
    container_name: mongos1
    command: bash -c "chmod 400 /data/keyfile && exec mongos --configdb cfgrs/cfg1:27019,cfg2:27019,cfg3:27019 --port 27017 --bind_ip_all --keyFile /data/keyfile"
    ports:
      - "27017:27017"
    depends_on:
      - cfg1
      - cfg2
      - cfg3
    volumes:
      - ./keyfile:/data/keyfile
    networks:
      - mongo-cluster

  mongos2:
    image: mongo:7
    container_name: mongos2
    command: bash -c "chmod 400 /data/keyfile && exec mongos --configdb cfgrs/cfg1:27019,cfg2:27019,cfg3:27019 --port 27017 --bind_ip_all --keyFile /data/keyfile"
    ports:
      - "27018:27017"
    depends_on:
      - cfg1
      - cfg2
      - cfg3
    volumes:
      - ./keyfile:/data/keyfile
    networks:
      - mongo-cluster

networks:
  mongo-cluster:
    driver: bridge

volumes:
  cfg1_data:
  cfg2_data:
  cfg3_data:
  shard1a_data:
  shard1b_data:
  shard1c_data:
  shard2a_data:
  shard2b_data:
  shard2c_data:
  shard3a_data:
  shard3b_data:
  shard3c_data:
  shard4a_data:
  shard4b_data:
  shard4c_data: