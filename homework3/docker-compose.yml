version: "3.9"

services:
  cfg1:
    image: mongo:7
    container_name: cfg1
    command: bash -c "chmod 400 /data/keyfile && exec mongod --configsvr --replSet cfgrs --port 27019 --bind_ip_all --keyFile /data/keyfile"
    volumes:
      - cfg1_data:/data/db
      - ./keyfile:/data/keyfile
    networks:
      - mongo-cluster

  cfg2:
    image: mongo:7
    container_name: cfg2
    command: bash -c "chmod 400 /data/keyfile && exec mongod --configsvr --replSet cfgrs --port 27019 --bind_ip_all --keyFile /data/keyfile"
    volumes:
      - cfg2_data:/data/db
      - ./keyfile:/data/keyfile
    networks:
      - mongo-cluster

  cfg3:
    image: mongo:7
    container_name: cfg3
    command: bash -c "chmod 400 /data/keyfile && exec mongod --configsvr --replSet cfgrs --port 27019 --bind_ip_all --keyFile /data/keyfile"
