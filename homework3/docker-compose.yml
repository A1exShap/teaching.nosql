    volumes:
      - shard1b_data:/data/db
      - ./keyfile:/data/keyfile
    networks:
      - mongo-cluster

  shard1c:
    image: mongo:7
    container_name: shard1c
    command: bash -c "chmod 400 /data/keyfile && exec mongod --shardsvr --replSet shard1RS --port 27018 --bind_ip_all --keyFile /data/keyfile"
    volumes:
      - shard1c_data:/data/db
      - ./keyfile:/data/keyfile
    networks:
      - mongo-cluster

  shard2a:
