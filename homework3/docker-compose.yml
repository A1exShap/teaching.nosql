    command: bash -c "chmod 400 /data/keyfile && exec mongod --shardsvr --replSet shard2RS --port 27018 --bind_ip_all --keyFile /data/keyfile"
    volumes:
      - shard2b_data:/data/db
      - ./keyfile:/data/keyfile
    networks:
      - mongo-cluster

  shard2c:
    image: mongo:7
    container_name: shard2c
    command: bash -c "chmod 400 /data/keyfile && exec mongod --shardsvr --replSet shard2RS --port 27018 --bind_ip_all --keyFile /data/keyfile"
    volumes:
      - shard2c_data:/data/db
      - ./keyfile:/data/keyfile
    networks:
      - mongo-cluster

  shard3a:
    image: mongo:7
    container_name: shard3a
    command: bash -c "chmod 400 /data/keyfile && exec mongod --shardsvr --replSet shard3RS --port 27018 --bind_ip_all --keyFile /data/keyfile"
    volumes:
