  shard3c:
    image: mongo:7
    container_name: shard3c
    command: bash -c "chmod 400 /data/keyfile && exec mongod --shardsvr --replSet shard3RS --port 27018 --bind_ip_all --keyFile /data/keyfile"
    volumes:
      - shard3c_data:/data/db
      - ./keyfile:/data/keyfile
    networks:
      - mongo-cluster

  shard4a:
    image: mongo:7
    container_name: shard4a
    command: bash -c "chmod 400 /data/keyfile && exec mongod --shardsvr --replSet shard4RS --port 27018 --bind_ip_all --keyFile /data/keyfile"
