services:
  neo4j:
    image: neo4j:5.26
    container_name: neo4j-demo
    ports:
      - "7474:7474"   # Neo4j Browser (веб-интерфейс)
      - "7687:7687"   # Bolt (для подключения)
    environment:
      - NEO4J_AUTH=neo4j/StrongPassword123
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

volumes:
  neo4j-data: