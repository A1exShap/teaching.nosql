version: "3.8"

services:
  redis-1:
    image: redis:7.2
    container_name: redis-1
    command: redis-server --port 7001 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass demo123 --masterauth demo123
    ports:
      - "7001:7001"
    volumes:
      - redis-1-data:/data
    networks:
      - redis-cluster-net

  redis-2:
    image: redis:7.2
    container_name: redis-2
    command: redis-server --port 7002 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --requirepass demo123 --masterauth demo123
