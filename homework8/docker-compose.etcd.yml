services:
  etcd-1:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: etcd-1
    hostname: etcd-1
    networks:
      etcd-net:
        ipv4_address: 172.31.0.11
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd-1-data:/etcd-data
    command: >
      /usr/local/bin/etcd
        --name etcd-1
        --data-dir /etcd-data
        --listen-client-urls http://0.0.0.0:2379
        --advertise-client-urls http://172.31.0.11:2379
        --listen-peer-urls http://0.0.0.0:2380
        --initial-advertise-peer-urls http://172.31.0.11:2380
        --initial-cluster etcd-1=http://172.31.0.11:2380,etcd-2=http://172.31.0.12:2380,etcd-3=http://172.31.0.13:2380
        --initial-cluster-token etcd-cluster-1
        --initial-cluster-state new
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  etcd-2:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: etcd-2
    hostname: etcd-2
    networks:
      etcd-net:
        ipv4_address: 172.31.0.12
    volumes:
      - etcd-2-data:/etcd-data
    command: >
      /usr/local/bin/etcd
        --name etcd-2
        --data-dir /etcd-data
        --listen-client-urls http://0.0.0.0:2379
        --advertise-client-urls http://172.31.0.12:2379
        --listen-peer-urls http://0.0.0.0:2380
        --initial-advertise-peer-urls http://172.31.0.12:2380
        --initial-cluster etcd-1=http://172.31.0.11:2380,etcd-2=http://172.31.0.12:2380,etcd-3=http://172.31.0.13:2380
        --initial-cluster-token etcd-cluster-1
        --initial-cluster-state new
    depends_on:
      etcd-1:
        condition: service_started
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  etcd-3:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: etcd-3
    hostname: etcd-3
    networks:
      etcd-net:
        ipv4_address: 172.31.0.13
    volumes:
      - etcd-3-data:/etcd-data
    command: >
      /usr/local/bin/etcd
        --name etcd-3
        --data-dir /etcd-data
        --listen-client-urls http://0.0.0.0:2379
        --advertise-client-urls http://172.31.0.13:2379
        --listen-peer-urls http://0.0.0.0:2380
        --initial-advertise-peer-urls http://172.31.0.13:2380
        --initial-cluster etcd-1=http://172.31.0.11:2380,etcd-2=http://172.31.0.12:2380,etcd-3=http://172.31.0.13:2380
        --initial-cluster-token etcd-cluster-1
        --initial-cluster-state new
    depends_on:
      etcd-1:
        condition: service_started
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  etcd-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  etcd-1-data:
  etcd-2-data:
  etcd-3-data: