global:
  scrape_interval:     5s
  evaluation_interval: 5s

scrape_configs:

  - job_name: consul_servers
    metrics_path: /v1/agent/metrics
    params:
      format: ["prometheus"]
    static_configs:
      - targets:
          - consul-server-1:8500
          - consul-server-2:8500
          - consul-server-3:8500
        labels:
          role: server

  - job_name: consul_clients
    metrics_path: /v1/agent/metrics
    params:
      format: ["prometheus"]
    static_configs:
      - targets:
          - consul-client-1:8500
          - consul-client-2:8500
          - consul-client-3:8500
          - consul-client-lb:8500
        labels:
          role: client

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]